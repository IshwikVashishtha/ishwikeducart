<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>User Profile</title>
</head>
<body>
    <div id="main-wrapper" class="p-0 auth-customizer-none" style="background: linear-gradient(to top right ,#add8e6, #ff69b4);">
        <div class="auth-login d-flex align-items-center justify-content-center vh-100">
            <div class="auth-login-wrapper card container p-4  rounded-5" style="background: linear-gradient(to bottom left, #ffb6c1, #dda0dd);">
                <div class="row align-items-center justify-content-center">
                    <div class="col-lg-6 d-none d-lg-block">
                           <a href="{{url_for('index')}}" class="d-flex flex-row align-items-center text-decoration-none">
<!--                                <img src="https://bootstrapdemos.wrappixel.com/spike/dist/assets/images/logos/logo-dark.svg" alt="Logo-Dark" class="img-fluid me-2">-->
                                <h4 class="mb-0 fs-3" style="position: relative; left: -10px; background: linear-gradient(to bottom left, #ffb6c1, #dda0dd); text-decoration: none;">Educart</h4>
                           </a>
                        <div class="text-center">
                            <img src="https://bootstrapdemos.wrappixel.com/spike/dist/assets/images/backgrounds/login-security.png" alt="spike-img" class="img-fluid">
                        </div>
                    </div>
                    <div class="col-lg-6 ">
                        <h2 class="mb-4 fs-8 fw-bolder text-center">Welcome to Educart</h2>
                        <div class="d-grid gap-3 mb-4">
                            <a class="btn btn-outline-dark d-flex align-items-center justify-content-center py-3 rounded-5" href="javascript:void(0)" role="button">
                                <img src="https://bootstrapdemos.wrappixel.com/spike/dist/assets/images/svgs/google-icon.svg" alt="spike-img" class="me-2" width="24" height="24">
                                Sign in with Google
                            </a>
                        </div>
                        <div class="text-center  mb-4">
                            <p class="fs-6">------------------------------------- or sign in with ---------------------------------------</p>
                        </div>
                        <form action="{{url_for('login')}}" method="POST">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">email</label>
                                <input type="email" class="form-control py-3 rounded-5 bg-transparent" name="email" id="exampleInputEmail1" aria-describedby="emailHelp">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label fw-bold">Password</label>
                                <input type="password" class="form-control py-3 rounded-5 bg-transparent" name="password" id="exampleInputPassword1">
                            </div>
                            <div class="d-md-flex align-items-center justify-content-between mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="flexCheckChecked" checked>
                                    <label class="form-check-label" for="flexCheckChecked">
                                        Remember this Device
                                    </label>
                                </div>
                                <a class="text-primary fw-medium" href="../dark/authentication-forgot-password.html">Forgot Password?</a>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3 rounded-5">Sign In</button>
                            <div class="d-flex justify-content-center">
                                <p class="mb-0 me-2">New to Spike?</p>
                                <a class="text-primary fw-bold" href="../dark/authentication-register.html">Create an account</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
