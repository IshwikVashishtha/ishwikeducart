{% extends 'header.html' %}
{% block title %}Chat{% endblock %}
{% block head %}
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"
          integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO"
          crossorigin="anonymous"></script>
  <!-- Include Font Awesome for icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
  <style>
    /* Custom styles for messages */
    .received {
      background-color: white;
      border: 1px solid black;
      padding: 0.5rem;
      border-radius: 0.5rem;
      align-self: flex-start;
      margin-bottom: 0.5rem;
      width: fit-content;
      max-width: 75%;
      word-wrap: break-word;
    }
    .sent {
      background-color: #3B82F6;
      color: white;
      padding: 0.5rem;
      border-radius: 0.5rem;
      align-self: flex-end;
      margin-bottom: 0.5rem;
      width: fit-content;
      max-width: 75%;
      word-wrap: break-word;
      margin-left:auto;
    }
  </style>
{% endblock %}
{% block content %}
<div class="flex flex-col h-screen bg-gray-100">
    <!-- Chat Header -->
    <div class="bg-blue-600 text-white p-4 flex items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gray-300 rounded-full"></div>
            <div>
                <h2 class="text-lg font-semibold">Chat with {{ target }}</h2>
                <p class="text-sm text-gray-200">Private Message</p>
            </div>
        </div>
    </div>
    <!-- Conversation Area -->
    <div id="conversation" class="flex-1 overflow-y-auto p-4 bg-black">
        <!-- Chat messages will appear here -->
    </div>
    <!-- Input Area -->
    <div class="bg-black p-4 flex items-center space-x-2 shadow-inner">
        <input type="text" placeholder="Type a message..."
               class="flex-1 p-3 text-gray-100 border bg-black rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
               id="messageInput">
        <button id="sendButton" class="bg-blue-500 text-white p-3 rounded-lg hover:bg-blue-600 transition-colors">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
</div>

<script>
  const socket = io();
  const room = "{{ room }}";
  const username = "{{ username }}";
  const conversation = document.getElementById('conversation');
  const messageInput = document.getElementById('messageInput');
  const sendButton = document.getElementById('sendButton');

  // Join the room on connection
  socket.on('connect', () => {
      socket.emit('join', { room: room, username: username });
      const p = document.createElement('p');
      p.innerText = "You are connected to room: " + room;
      p.className = "text-gray-500 text-sm italic";
      conversation.appendChild(p);
      conversation.scrollTop = conversation.scrollHeight;
  });

  // Send message function
  function sendMessage() {
      const message = messageInput.value.trim();
      if (message !== "") {
          socket.emit("message", { message: message, sender: username, room: room });
          messageInput.value = "";
      }
  }

  // Send on Enter key press
  messageInput.addEventListener('keypress', (event) => {
      if (event.key === 'Enter') sendMessage();
  });

  // Send on button click
  sendButton.addEventListener('click', sendMessage);

  // Display incoming messages
  socket.on('message', (data) => {
      const messageElement = document.createElement('p');
      messageElement.innerText = data.message;
      messageElement.className = data.sender === username ? "sent" : "received";
      conversation.appendChild(messageElement);
      conversation.scrollTop = conversation.scrollHeight;
  });

  // Display chat notifications (e.g., join/leave)
  socket.on('chat', (data) => {
      const messageElement = document.createElement('p');
      messageElement.innerText = data.message;
      messageElement.className = "text-gray-500 text-sm italic";
      conversation.appendChild(messageElement);
      conversation.scrollTop = conversation.scrollHeight;
  });
</script>
{% endblock %}
