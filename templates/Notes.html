
<html>
<head>
    <title>Engineering Notes</title>
    <link
      href="{{ url_for('static', filename='css/Notes.css') }}"
      rel="stylesheet"
    />
</head>
<body>
   {% include "header.html" %}
        <img src="https://static.vecteezy.com/system/resources/previews/024/905/052/non_2x/antique-bible-on-old-fashioned-table-selective-focus-generated-by-ai-free-photo.jpg" alt="">
    
    <h1>Engineering Notes</h1>
    <div class="filter-container">
        <label class="filter-label">Filter by Subject:</label>
              <select id="subject-filter" class="filter-input">
        <option value="">All Subjects</option>
        <option value="Mathematics">Mathematics</option>
        <option value="Physics">Physics</option>
        <option value="Chemistry">Chemistry</option>
        <option value="Programing for Problem Solving">
          Programing for Problem Solving
        </option>
        <option value="Electrical Engineering">Electrical Engineering</option>
        <option value="Electronic Engineering">Electronic Engineering</option>
        <option value="Environment and ecology">Environment and ecology</option>
        <option value="Mechanical Engineering">Mechanical Engineering</option>
        <option value="soft skill ">soft skill</option>
        <option value="data structures">Data Structures</option>
      </select>
        <label class="filter-label">Filter by Year:</label>
        <select id="year-filter" class="filter-input">
            <option value="">All Years</option>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
        </select>
        <button id="apply-filter" class="filter-input">Apply Filter</button>
    </div>
    <ul id="note-list" class="note-list">
        <!-- List of notes will be generated dynamically using python -->
        {% for note in Notes %}
            <li>
                <h3>{{ note['title'] }}</h3>
                <p><strong>Subject:</strong> {{ note['subject'] }}</p>
                <p><strong>Year:</strong> {{ note['year'] }}</p>
                <p>{{ note['description'] }}</p>
                <button>
                    <span><a href="{{ note['pdfLink'] }}" download>Download</a></span>
                    <svg width="34" height="34" viewBox="0 0 74 74" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="37" cy="37" r="35.5" stroke="black" stroke-width="3"></circle>
                        <path d="M25 35.5C24.1716 35.5 23.5 36.1716 23.5 37C23.5 37.8284 24.1716 38.5 25 38.5V35.5ZM49.0607 38.0607C49.6464 37.4749 49.6464 36.5251 49.0607 35.9393L39.5147 26.3934C38.9289 25.8076 37.9792 25.8076 37.3934 26.3934C36.8076 26.9792 36.8076 27.9289 37.3934 28.5147L45.8787 37L37.3934 45.4853C36.8076 46.0711 36.8076 47.0208 37.3934 47.6066C37.9792 48.1924 38.9289 48.1924 39.5147 47.6066L49.0607 38.0607ZM25 38.5L48 38.5V35.5L25 35.5V38.5Z" fill="black"></path>
                    </svg>
                </button>
            </li>

        {% endfor %}
    </ul>
    
     <script src="{{url_for('static', filename ='js/Notes.js')}}"></script>
</body>
</html>
