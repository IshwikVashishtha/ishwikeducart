<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-lg space-y-8">
        <h2 class="text-center text-3xl font-extrabold text-gray-900">
            Change Password
        </h2>

        <form class="space-y-6">
            <div class="space-y-4">
                <!-- Current Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">
                        Current Password
                    </label>
                    <div class="mt-1 relative">
                        <input type="password"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                            required>
                        <button type="button"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <i class="fa-regular fa-eye-slash text-gray-400"></i>
                        </button>
                    </div>
                </div>

                <!-- New Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">
                        New Password
                    </label>
                    <div class="mt-1 relative">
                        <input type="password"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                            required>
                        <button type="button"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <i class="fa-regular fa-eye text-gray-400"></i>
                        </button>
                    </div>

                    <!-- Password Strength -->
                    <div class="mt-2">
                        <div class="flex items-center space-x-2">
                            <div class="w-full h-2 bg-gray-200 rounded-full">
                                <div class="h-full bg-yellow-500 rounded-full w-3/5"></div>
                            </div>
                            <span class="text-sm font-medium text-gray-600">Medium</span>
                        </div>

                        <div class="mt-2 text-sm text-gray-600">
                            <ul class="space-y-1">
                                <li class="flex items-center space-x-2">
                                    <i class="fa-solid fa-check text-green-500"></i>
                                    <span>Minimum 8 characters</span>
                                </li>
                                <li class="flex items-center space-x-2">
                                    <i class="fa-solid fa-check text-green-500"></i>
                                    <span>At least one uppercase letter</span>
                                </li>
                                <li class="flex items-center space-x-2">
                                    <i class="fa-solid fa-times text-red-500"></i>
                                    <span>At least one number</span>
                                </li>
                                <li class="flex items-center space-x-2">
                                    <i class="fa-solid fa-times text-red-500"></i>
                                    <span>At least one special character</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">
                        Confirm New Password
                    </label>
                    <div class="mt-1 relative">
                        <input type="password"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                            required>
                        <button type="button"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <i class="fa-regular fa-eye-slash text-gray-400"></i>
                        </button>
                    </div>
                    <!-- Error Message Example -->
                    <p class="mt-2 text-sm text-red-600 hidden">Passwords do not match</p>
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex items-center justify-between space-x-4">
                <button type="button"
                    class="w-full py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                    Cancel
                </button>
                <button type="submit"
                    class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                    Change Password
                </button>
            </div>
        </form>
    </div>
</body>
</html>
